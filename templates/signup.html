{% extends "base.html" %}
{% block title %}Create Account - PocketPilot{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header bg-primary text-white"><h5 class="mb-0">Create account</h5></div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" required></div>
                    <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" minlength="6" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100">Create account</button>
                </form>
                <p class="mt-3 mb-0 text-center">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
